<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login - GT Barcode System (ERP &amp; SCADA)</title>
    <link rel="icon" type="image/png" href="assets/img/Logo_Aplikasi.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/mobile.css">

    <style>
        :root {
            --app-bg: #0b0f19;
            --app-card: #111827;
            --app-input: #1a2233;
            --app-border: rgba(148, 163, 184, 0.16);
            --app-text: #f9fafb;
            --app-text-muted: #9ca3af;
            --app-accent: #3b82f6;
            --app-accent-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(120% 60% at 50% 0%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
                radial-gradient(80% 50% at 50% 100%, rgba(6, 182, 212, 0.1) 0%, transparent 60%),
                var(--app-bg);
            background-attachment: fixed;
            color: var(--app-text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .m-login-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .m-brand-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid var(--app-border);
            border-radius: 22px;
            padding: 22px 20px 18px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .m-brand-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
        }

        .m-brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .m-brand-logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .m-logo-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid rgba(96, 165, 250, 0.4);
            display: grid;
            place-items: center;
            padding: 3px;
            box-shadow: 0 8px 16px -6px rgba(59, 130, 246, 0.5);
            overflow: hidden;
            flex-shrink: 0;
        }

        .m-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 11px;
        }

        .m-brand-info h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #ffffff;
            line-height: 1.2;
        }

        .m-brand-info p {
            font-size: 11px;
            font-weight: 600;
            color: var(--app-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        .m-pills-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .m-shift-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.28);
            white-space: nowrap;
        }

        .m-shift-pill .m-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px #34d399;
        }

        .m-conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .m-conn-pill.online {
            background: rgba(16, 185, 129, 0.14);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .m-conn-pill.offline {
            background: rgba(245, 158, 11, 0.14);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }
        .m-conn-pill i {
            width: 5px; height: 5px; border-radius: 50%; background: currentColor;
        }

        .m-input-group { margin-bottom: 14px; }

        .m-input-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .m-input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .m-input-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            color: #64748b;
            pointer-events: none;
            display: grid;
            place-items: center;
            transition: color 0.2s ease;
        }

        .m-input-field {
            width: 100%;
            height: 50px;
            background: var(--app-input);
            border: 1px solid var(--app-border);
            border-radius: 14px;
            padding: 0 44px 0 44px;
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
            outline: none;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .m-input-field:focus {
            border-color: #3b82f6;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .m-input-box:focus-within .m-input-icon { color: #60a5fa; }

        .m-input-toggle-pwd {
            position: absolute;
            right: 12px;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            display: grid;
            place-items: center;
            border-radius: 8px;
        }

        .m-btn-login {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #0284c7 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.65);
            transition: transform 0.15s ease, opacity 0.2s ease;
            margin-top: 18px;
        }

        .m-btn-login:active { transform: scale(0.97); }
        .m-btn-login[disabled] { opacity: 0.65; cursor: wait; }

        .m-alert-box {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            display: none;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 14px;
            line-height: 1.45;
        }
        .m-alert-box.show { display: flex; }
        .m-alert-box.error {
            background: rgba(239, 68, 68, 0.13);
            border: 1px solid rgba(239, 68, 68, 0.42);
            color: #fca5a5;
        }
        .m-alert-box.info {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fcd34d;
        }
        .m-alert-box.success {
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .m-quick-card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--app-border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .m-quick-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .m-quick-head-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .m-offline-rule-note {
            font-size: 11.5px;
            line-height: 1.45;
            padding: 9px 12px;
            border-radius: 11px;
            margin-bottom: 10px;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: #cbd5e1;
        }

        .m-quick-filter {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .m-quick-filter::-webkit-scrollbar { display: none; }

        .m-filter-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--app-border);
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .m-filter-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        .m-quick-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 235px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .m-account-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 14px;
            text-decoration: none;
            color: var(--app-text);
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.18s ease;
        }

        .m-account-item:active {
            transform: scale(0.98);
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(96, 165, 250, 0.4);
        }

        .m-account-item.locked-offline {
            opacity: 0.58;
        }

        .m-acc-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
        }

        .m-acc-text { flex: 1; min-width: 0; }

        .m-acc-name {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .m-acc-nik {
            font-size: 10.5px;
            font-weight: 700;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.65);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .m-ver-tag {
            font-size: 9.5px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 999px;
        }
        .m-ver-tag.ok {
            background: rgba(16, 185, 129, 0.16);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .m-ver-tag.req {
            background: rgba(245, 158, 11, 0.14);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .m-acc-desc {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .m-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            padding: 2px 4px;
        }

        .m-server-btn {
            background: none;
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="m-login-wrapper">

    <!-- Kartu Brand & Formulir Login (1:1 dengan website/login.php) -->
    <div class="m-brand-card">
        <div class="m-brand-header">
            <div class="m-brand-logo-wrap">
                <div class="m-logo-box">
                    <img src="assets/img/Logo_Aplikasi.png" alt="GT Logo">
                </div>
                <div class="m-brand-info">
                    <h1>GT BARCODE</h1>
                    <p>Plant ERP &amp; SCADA Mobile</p>
                </div>
            </div>
            <div class="m-pills-col">
                <div class="m-shift-pill">
                    <span class="m-dot"></span>
                    <span id="shiftLabel">Shift 1</span>
                </div>
                <div class="m-conn-pill online" id="connPill">
                    <i></i>
                    <span id="connText">Online Cloud</span>
                </div>
            </div>
        </div>

        <div class="m-alert-box" id="loginAlertBox">
            <svg width="18" height="18" style="flex-shrink:0;margin-top:1px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"></path>
            </svg>
            <span id="loginAlertText"></span>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="m-input-group">
                <label class="m-input-label" for="usernameInput">NIK / Username Karyawan</label>
                <div class="m-input-box">
                    <div class="m-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    </div>
                    <input type="text" id="usernameInput" name="username" class="m-input-field" placeholder="Contoh: SA-001 atau OP-CUR-01" required autocomplete="username">
                </div>
            </div>

            <div class="m-input-group">
                <label class="m-input-label" for="passwordInput">Password Terminal</label>
                <div class="m-input-box">
                    <div class="m-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    </div>
                    <input type="password" id="passwordInput" name="password" class="m-input-field" placeholder="Masukkan password..." required autocomplete="current-password">
                    <button type="button" class="m-input-toggle-pwd" id="togglePasswordBtn" aria-label="Lihat Password">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="m-btn-login" id="submitLoginBtn">
                <span id="submitLoginLabel">Masuk ke Sistem</span>
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </form>
    </div>

    <!-- Pilihan Akses Cepat / Akun Terverifikasi -->
    <div class="m-quick-card">
        <div class="m-quick-head">
            <div class="m-quick-head-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
                <span id="quickCardTitle">Akses Cepat Uji Jabatan</span>
            </div>
            <span style="font-size: 10.5px; color: #60a5fa; font-weight: 700;" id="quickCardBadge">Cloud Supabase</span>
        </div>

        <div class="m-offline-rule-note" id="offlineRuleBanner">
            Memeriksa status koneksi dan akun terverifikasi pada perangkat...
        </div>

        <div class="m-quick-filter">
            <button type="button" class="m-filter-btn active" data-filter="all">Semua (11)</button>
            <button type="button" class="m-filter-btn" data-filter="operator">Operator (4)</button>
            <button type="button" class="m-filter-btn" data-filter="dept">Dept (4)</button>
            <button type="button" class="m-filter-btn" data-filter="mgmt">Manajemen (2)</button>
            <button type="button" class="m-filter-btn" data-filter="admin">Admin (1)</button>
        </div>

        <div class="m-quick-list" id="quickAccountList"></div>
    </div>

    <div class="m-footer-row">
        <span>PT Gajah Tunggal Tbk &bull; Cloud + Offline PDT v2.0</span>
        <button type="button" class="m-server-btn" onclick="if(window.AndroidPDT) window.AndroidPDT.openServerConfig();">Server Cloud</button>
    </div>

</div>

<script>
(function () {
    'use strict';

    const DEMO_ACCOUNTS = [
        { category: 'admin',    nik: 'SA-001',       role: 'Super Admin',         name: 'Bambang Pratama',   desc: 'Akses Penuh Seluruh Modul',         color: '#3b82f6', badge: 'SA'  },
        { category: 'mgmt',     nik: 'PH-001',       role: 'Plant Head',          name: 'Ir. Hendra Gunawan',desc: 'Akses Luas Pemantauan Pabrik',      color: '#10b981', badge: 'PH'  },
        { category: 'mgmt',     nik: 'APH-001',      role: 'Asst Plant Head',     name: 'Dedi Kusnadi',      desc: 'Pengawasan Operasional Pabrik',     color: '#a855f7', badge: 'APH' },
        { category: 'dept',     nik: 'HEAD-CUR-01',  role: 'Dept Head Curing',    name: 'Heri Susanto',      desc: 'Kepala Departemen Curing',          color: '#f59e0b', badge: 'DH'  },
        { category: 'dept',     nik: 'AHEAD-CUR-01', role: 'Asst Dept Head',      name: 'Joko Widodo',       desc: 'Asisten Kepala Dept Curing',        color: '#f97316', badge: 'ADH' },
        { category: 'dept',     nik: 'ADM-CUR-01',   role: 'Admin Dept Curing',   name: 'Rina Astuti',       desc: 'Admin Khusus Dept Curing',          color: '#06b6d4', badge: 'ADM' },
        { category: 'dept',     nik: 'ADM-WH-01',    role: 'Admin Gudang',        name: 'Siti Rahma',        desc: 'Admin Gudang Bahan Baku',           color: '#06b6d4', badge: 'WH'  },
        { category: 'operator', nik: 'SH-CUR-01',    role: 'Section Head Curing', name: 'Fajar Nugroho',     desc: 'Kepala Seksi Produksi Curing',      color: '#ec4899', badge: 'SH'  },
        { category: 'operator', nik: 'LDR-CUR-01',   role: 'Leader Curing',       name: 'Aris Munandar',     desc: 'Leader Regu Curing Press',          color: '#8b5cf6', badge: 'LDR' },
        { category: 'operator', nik: 'OP-CUR-01',    role: 'Operator Curing',     name: 'Kuswanto',          desc: 'Operator Stasiun Curing Press',     color: '#64748b', badge: 'OP'  },
        { category: 'operator', nik: 'OP-CUR-04',    role: 'Operator Repair',     name: 'Rahmat Hidayat',    desc: 'Operator Stasiun Repair Ban',       color: '#64748b', badge: 'REP' }
    ];

    let activeFilter = 'all';
    let verifiedSet = new Set();

    function computeShift() {
        if (window.AndroidPDT && typeof window.AndroidPDT.getCurrentShift === 'function') {
            return window.AndroidPDT.getCurrentShift();
        }
        const h = new Date().getHours();
        if (h >= 6 && h < 14) return 1;
        if (h >= 14 && h < 22) return 2;
        return 3;
    }

    function checkOnline() {
        if (window.AndroidPDT && typeof window.AndroidPDT.isOnline === 'function') {
            return !!window.AndroidPDT.isOnline();
        }
        return navigator.onLine;
    }

    function loadVerifiedAccounts() {
        verifiedSet = new Set();
        if (window.AndroidPDT && typeof window.AndroidPDT.getVerifiedAccountsJson === 'function') {
            try {
                const arr = JSON.parse(window.AndroidPDT.getVerifiedAccountsJson() || '[]');
                arr.forEach(item => {
                    if (item && item.nik) verifiedSet.add(String(item.nik).toUpperCase());
                    if (item && item.username) verifiedSet.add(String(item.username).toUpperCase());
                });
            } catch (e) {}
        }
    }

    function showAlert(msg, type) {
        const box = document.getElementById('loginAlertBox');
        const txt = document.getElementById('loginAlertText');
        box.className = 'm-alert-box show ' + (type || 'error');
        txt.textContent = msg;
    }

    function hideAlert() {
        document.getElementById('loginAlertBox').className = 'm-alert-box';
    }

    function refreshStatusUI() {
        document.getElementById('shiftLabel').textContent = 'Shift ' + computeShift();
        loadVerifiedAccounts();

        const online = checkOnline();
        const pill = document.getElementById('connPill');
        const connTxt = document.getElementById('connText');
        const note = document.getElementById('offlineRuleBanner');
        const badge = document.getElementById('quickCardBadge');

        if (online) {
            pill.className = 'm-conn-pill online';
            connTxt.textContent = 'Online Cloud';
            badge.textContent = '1-Klik Cloud Login';
            note.innerHTML = 'Terhubung ke <b>Vercel + Supabase Cloud</b>. Akun yang login saat Online otomatis didaftarkan agar bisa login saat Offline di perangkat ini.';
        } else {
            pill.className = 'm-conn-pill offline';
            connTxt.textContent = 'Mode Offline';
            badge.textContent = verifiedSet.size + ' Akun Terverifikasi';
            if (verifiedSet.size === 0) {
                note.innerHTML = '<b style="color:#fbbf24;">Perangkat Offline &amp; Belum Ada Akun Terdaftar:</b> Anda wajib terhubung ke internet minimal satu kali untuk memverifikasi akun sebelum dapat login secara offline.';
            } else {
                note.innerHTML = '<b style="color:#34d399;">Mode Offline Aktif:</b> Hanya akun berlabel <b>Terverifikasi Offline</b> (pernah login Online di HP ini) yang diizinkan masuk.';
            }
        }

        renderAccountList();
    }

    function renderAccountList() {
        const listEl = document.getElementById('quickAccountList');
        const online = checkOnline();
        listEl.innerHTML = '';

        DEMO_ACCOUNTS.forEach(acc => {
            if (activeFilter !== 'all' && acc.category !== activeFilter) return;

            const isVerified = verifiedSet.has(acc.nik.toUpperCase());
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'm-account-item' + (!online && !isVerified ? ' locked-offline' : '');

            let tagHtml = '';
            if (isVerified) {
                tagHtml = '<span class="m-ver-tag ok">&#10003; Terverifikasi Offline</span>';
            } else if (!online) {
                tagHtml = '<span class="m-ver-tag req">Wajib Online Dulu</span>';
            }

            btn.innerHTML =
                '<div class="m-acc-badge" style="background:' + acc.color + ';">' + acc.badge + '</div>' +
                '<div class="m-acc-text">' +
                    '<div class="m-acc-name">' +
                        '<span>' + acc.role + '</span>' +
                        '<span class="m-acc-nik">' + acc.nik + '</span>' +
                        tagHtml +
                    '</div>' +
                    '<div class="m-acc-desc">' + acc.name + ' &bull; ' + acc.desc + '</div>' +
                '</div>' +
                '<div style="color:#64748b;font-size:13px;">&rarr;</div>';

            btn.addEventListener('click', () => handleQuickAccountTap(acc, isVerified));
            listEl.appendChild(btn);
        });
    }

    function handleQuickAccountTap(acc, isVerified) {
        const online = checkOnline();
        if (!online && !isVerified) {
            if (window.AndroidPDT) window.AndroidPDT.playErrorBeep();
            showAlert(
                'Login Offline Ditolak: Akun ' + acc.nik + ' (' + acc.role + ') belum pernah login saat Online di perangkat ini. Hubungkan HP ke internet untuk login pertama kali.',
                'error'
            );
            return;
        }

        document.getElementById('usernameInput').value = acc.nik;
        document.getElementById('passwordInput').value = 'password123';
        executeLogin(acc.nik, 'password123');
    }

    function executeLogin(username, password) {
        hideAlert();
        const btn = document.getElementById('submitLoginBtn');
        const lbl = document.getElementById('submitLoginLabel');
        btn.disabled = true;
        lbl.textContent = checkOnline() ? 'Memverifikasi ke Supabase...' : 'Memeriksa Vault Offline...';

        if (window.AndroidPDT && typeof window.AndroidPDT.performLoginAsync === 'function') {
            window.AndroidPDT.performLoginAsync(username, password);
        } else {
            btn.disabled = false;
            lbl.textContent = 'Masuk ke Sistem';
            showAlert('Bridge AndroidPDT tidak terdeteksi.', 'error');
        }
    }

    window.onNativeLoginResult = function (success, message) {
        const btn = document.getElementById('submitLoginBtn');
        const lbl = document.getElementById('submitLoginLabel');
        btn.disabled = false;
        lbl.textContent = 'Masuk ke Sistem';

        if (success) {
            showAlert(message || 'Login berhasil! Membuka ruang kerja...', 'success');
        } else {
            showAlert(message || 'Gagal melakukan otentikasi.', 'error');
            refreshStatusUI();
        }
    };

    window.onNativeNetworkStateChanged = function () {
        refreshStatusUI();
    };

    // Toggle Password
    document.getElementById('togglePasswordBtn').addEventListener('click', function () {
        const pwd = document.getElementById('passwordInput');
        const isPwd = pwd.type === 'password';
        pwd.type = isPwd ? 'text' : 'password';
        this.style.color = isPwd ? '#60a5fa' : '#64748b';
    });

    // Category filter buttons
    document.querySelectorAll('.m-filter-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.m-filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            activeFilter = this.getAttribute('data-filter') || 'all';
            renderAccountList();
        });
    });

    // Submit form
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const u = document.getElementById('usernameInput').value.trim();
        const p = document.getElementById('passwordInput').value;
        executeLogin(u, p);
    });

    window.addEventListener('online', refreshStatusUI);
    window.addEventListener('offline', refreshStatusUI);

    refreshStatusUI();
})();
</script>
</body>
</html>
